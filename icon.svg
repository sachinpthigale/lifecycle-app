<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Border -->
  <rect width="512" height="512" rx="112" fill="none" stroke="#374151" stroke-width="4" opacity="0.4"/>

  <!-- The LifeLine Axis -->
  <line x1="48" y1="256" x2="464" y2="256" stroke="url(#lineGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Secondary Dots -->
  <circle cx="120" cy="256" r="14" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <circle cx="120" cy="256" r="4" fill="#94a3b8"/>

  <circle cx="392" cy="256" r="14" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <circle cx="392" cy="256" r="4" fill="#94a3b8"/>

  <!-- Center Hero Dot with Glow -->
  <circle cx="256" cy="256" r="38" fill="#1e3a8a" opacity="0.6" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="28" fill="#090a0f" stroke="#3b82f6" stroke-width="6"/>
  <circle cx="256" cy="256" r="10" fill="#60a5fa"/>
</svg>
